[mypy]
strict = True
warn_unreachable = True
implicit_reexport = True
disallow_any_explicit = True

[mypy-test.*]
allow_untyped_defs = True
allow_incomplete_defs = True

########################################

[coverage:run]
  branch = True
  concurrency = multiprocessing

[coverage:report]
  fail_under = 100
  skip_covered = True

  partial_branches =
    no-branch
    itertools\.count()

  exclude_also =
    no-cover
    -> .*: \.\.\.
    if TYPE_CHECKING:
